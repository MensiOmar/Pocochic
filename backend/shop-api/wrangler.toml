name = "pocochic-shop-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
SHOP_WEB_ORIGIN = "https://shop.example.com"
SHOP_ALERT_EMAIL = "pocochicaccessories@gmail.com"
SHOP_ALERT_FROM = "onboarding@resend.dev"

# Replace database_id before the first real deploy. Local dev uses src/node.ts + pocochic/data/pocochic.db.
[[d1_databases]]
binding = "DB"
database_name = "pocochic"
database_id = "00000000-0000-0000-0000-000000000001"

[[r2_buckets]]
binding = "CATALOG"
bucket_name = "pocochic-catalog"
