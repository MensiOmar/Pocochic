name: Deploy shop-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shop-web
        run: npm run build --workspace=@pocochic/shop-web
        env:
          VITE_API_ORIGIN: https://pocochic-shop-api.pocochicaccessories.workers.dev
      - name: Deploy to Cloudflare Pages
        working-directory: backend/shop-api
        run: npx wrangler pages deploy ../../frontend/shop-web/dist --project-name=pocochic-shop --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
