version: "3.8"

services:
  db:
    # Clean choice for local SQLite + HTTP UI on 8080 (datasetteproject/datasette)
    # Mirrors D1 (SQLite) for dev; see pocochic/DEVELOPMENT.md and obsidian/05-Architecture/Stack.md
    # Access UI: http://localhost:8080  (live view of ./data/pocochic.db relative to this compose file)
    image: datasetteproject/datasette:latest
    container_name: pocochic-db
    ports:
      - "8080:8001"
    volumes:
      - ./data:/data
    command: datasette /data/pocochic.db --port 8001 --host 0.0.0.0
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: pocochic-minio
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
